name: Build & Release Packages

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published, prereleased]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archlinux:
    name: Build Arch Linux Pacman Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git python ca-certificates curl jq

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build pacman package
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su - builder -c "cd $GITHUB_WORKSPACE && makepkg -srf --noconfirm"

      - name: Upload Arch Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-packages
          path: "*.pkg.tar.zst"

  termux:
    name: Build Termux Android (aarch64) Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Termux .deb package
        run: |
          ./build-termux.sh

      - name: Upload Termux packages
        uses: actions/upload-artifact@v4
        with:
          name: termux-packages
          path: dist/*.deb

  release:
    name: Publish Release Assets
    needs: [archlinux, termux]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: List release assets
        run: ls -lh release-assets/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.pkg.tar.zst
            release-assets/*.deb
